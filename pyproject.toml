[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-operations-platform"
version = "0.1.0"
description = "Local-first security log investigation platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "uvicorn[standard]>=0.30,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
